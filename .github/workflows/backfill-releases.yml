name: Backfill releases

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/backfill-releases.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Create missing releases
        run: |
          for tag in v0.1.0 v0.1.1 v0.1.2 v0.1.3; do
            if gh release view "$tag" > /dev/null 2>&1; then
              echo "$tag already has a release"
              continue
            fi
            awk -v version="## ${tag#v} " '
              index($0, version) == 1 { found = 1; next }
              /^## / { found = 0 }
              found
            ' docs/changelog.md > notes.md
            gh release create "$tag" --title "$tag" --notes-file notes.md --verify-tag --latest=false
          done
        env:
          GH_TOKEN: ${{ github.token }}
