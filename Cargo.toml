[workspace]
members = ["crates/ozaru-engine"]
# Fuzzing needs a nightly toolchain, so it has its own workspace.
exclude = ["crates/ozaru-engine/fuzz"]

[package]
name = "ozaru"
version = "0.3.2"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "ozaru"
crate-type = ["cdylib"]

[dependencies]
# ozaru's own PDF engine, which reads every PDF.
ozaru-engine = { path = "crates/ozaru-engine" }
pyo3 = { version = "0.29.0", features = ["abi3-py310"] }
