[workspace]
members = ["crates/ozaru-engine"]
# Fuzzing needs a nightly toolchain, so it has its own workspace.
exclude = ["crates/ozaru-engine/fuzz"]

[package]
name = "ozaru"
version = "0.2.3"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "ozaru"
crate-type = ["cdylib"]

[dependencies]
# ozaru's own PDF engine, used by page_count.
ozaru-engine = { path = "crates/ozaru-engine" }
# Used by extract_text until the engine replaces it, in 0.3.0.
pdf_oxide = "0.3.78"
pyo3 = { version = "0.29.0", features = ["abi3-py310"] }
