[package]
name = "ozaru-engine"
version = "0.0.0"
edition = "2024"
description = "ozaru's own PDF engine, written in Rust."
license = "MIT"
repository = "https://github.com/Jair-dev57/ozaru"
publish = false

[dependencies]
# Only inflates Flate data. Pure Rust, with no unsafe code.
miniz_oxide = "0.9.1"
# Cryptography from RustCrypto, only to decrypt encrypted PDFs.
aes = "0.9.3"
cbc = "0.2.1"
md-5 = "0.11.0"
rc4 = "0.2.0"
sha2 = "0.11.0"
