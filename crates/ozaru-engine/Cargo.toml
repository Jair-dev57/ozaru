[package]
name = "ozaru-engine"
version = "0.0.0"
edition = "2024"
description = "ozaru's own PDF engine, written in Rust."
license = "MIT"
repository = "https://github.com/Jair-dev57/ozaru"
publish = false
# Only the code goes into the `ozaru` source distribution: the tests, their PDFs
# and the examples stay in the repository.
include = ["/src", "/Cargo.toml"]

[dependencies]
# Only inflates Flate data. Pure Rust, with no unsafe code.
miniz_oxide = "0.9.1"
# Cryptography from RustCrypto, only to decrypt encrypted PDFs.
aes = "0.9.3"
cbc = "0.2.1"
md-5 = "0.11.0"
rc4 = "0.2.0"
sha2 = "0.11.0"
# Only reads the cmap and post tables of embedded TrueType and OpenType fonts, to
# find the text of glyphs when a PDF doesn't give it. Safe Rust, MIT or Apache.
ttf-parser = { version = "0.25.1", default-features = false, features = ["std", "glyph-names"] }
# Only the levels of the Unicode Bidirectional Algorithm, to put lines of
# Arabic and Hebrew painted left to right back in reading order. MIT or Apache;
# its only unsafe code casts a byte slice to its levels, of the same layout.
unicode-bidi = { version = "0.3.18", default-features = false, features = ["std", "hardcoded-data"] }

[[bench]]
name = "engine"
harness = false
