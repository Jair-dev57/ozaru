[package]
name = "ozaru-engine-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ozaru-engine = { path = ".." }

[[bin]]
name = "indirect_object"
path = "fuzz_targets/indirect_object.rs"
test = false
doc = false
bench = false

[[bin]]
name = "lexer"
path = "fuzz_targets/lexer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_object"
path = "fuzz_targets/parse_object.rs"
test = false
doc = false
bench = false

# Kept out of the main workspace: fuzzing needs a nightly toolchain.
[workspace]
members = ["."]
