[package]
name = "ozaru-engine-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ozaru-engine = { path = ".." }

[[bin]]
name = "ascii_filters"
path = "fuzz_targets/ascii_filters.rs"
test = false
doc = false
bench = false

