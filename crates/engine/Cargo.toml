[package]
name = "ozaru-engine"
version = "0.0.0"
edition = "2024"
description = "ozaru's own PDF engine, written in Rust."
license = "MIT"
repository = "https://github.com/Jair-dev57/ozaru"
publish = false
# Only the code goes into the `ozaru` source distribution: the tests, their PDFs
# and the examples stay in the repository.
include = ["/src", "/Cargo.toml"]

# The engine depends on nothing: Flate, the ciphers and hashes, the Unicode
# bidirectional algorithm, fonts and the rasterizer are all in this crate. (The
# tables of Unicode bidirectional classes and the font files are data.)
[dependencies]

[[bench]]
name = "engine"
harness = false
