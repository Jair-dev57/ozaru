[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[project]
name = "ozaru"
description = "Read, draw, edit and protect PDF files from Python. Small API, Rust core, no dependencies."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Jair Estupiñan" }]
keywords = ["pdf", "pdf-reader", "text-extraction", "pdf-forms", "pdf-rendering", "pdf-encryption", "rust"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Text Processing",
    "Topic :: Multimedia :: Graphics :: Viewers",
    "Topic :: Office/Business",
    "Typing :: Typed",
]
dynamic = ["version"]

[project.urls]
Documentation = "https://jair-dev57.github.io/ozaru/"
Changelog = "https://jair-dev57.github.io/ozaru/changelog/"
Repository = "https://github.com/Jair-dev57/ozaru"
Issues = "https://github.com/Jair-dev57/ozaru/issues"

[project.scripts]
ozaru = "ozaru._cli:main"

[tool.maturin]
python-source = "python"
module-name = "ozaru.ozaru"
include = [{ path = "python/ozaru/py.typed", format = ["sdist", "wheel"] }]

[dependency-groups]
dev = [
    "maturin>=1.15.0",
    "pytest>=8",
]
docs = [
    "mkdocs-material>=9.8,<10; python_version >= '3.11'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }, { file = "Cargo.lock" }, { file = "src/**/*.rs" }]
