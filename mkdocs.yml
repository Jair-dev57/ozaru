site_name: ozaru
site_description: Read PDF files from Python with a small, simple API and a Rust core.
site_url: https://jair-dev57.github.io/ozaru/
repo_url: https://github.com/Jair-dev57/ozaru
repo_name: Jair-dev57/ozaru
edit_uri: edit/main/docs/

theme:
  name: material
  icon:
    logo: material/file-document-outline
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.action.edit
    - content.code.copy
    - content.tabs.link
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting started:
      - Installation: installation.md
      - First steps: first-steps.md
  - Tutorial:
      - Extract text: tutorial/extract-text.md
      - Count pages: tutorial/count-pages.md
      - Read the metadata: tutorial/read-metadata.md
      - Read page by page: tutorial/read-page-by-page.md
      - Handle errors: tutorial/handle-errors.md
      - Process a folder: tutorial/process-a-folder.md
  - Reference:
      - API: reference/api.md
      - Limitations: reference/limitations.md
  - Project:
      - Contributing: contributing.md
      - Changelog: changelog.md
